<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glowing Plants</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .romantic-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-family: 'Courier New', monospace;
      color: #ff77ff;
      text-align: center;
      text-shadow: 0 0 10px #ff77ff, 0 0 20px #ff77ff;
      animation: fadeIn 4s ease-in-out forwards;
      opacity: 0;
      z-index: 10;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* Opsional: efek teks menyala berganti warna */
    @keyframes glowText {
      0% { text-shadow: 0 0 10px #ff77ff; color: #ff77ff; }
      50% { text-shadow: 0 0 20px #77ffff; color: #77ffff; }
      100% { text-shadow: 0 0 10px #ff77ff; color: #ff77ff; }
    }

    .romantic-text {
      animation: glowText 5s infinite alternate;
    }

    /* Pastikan elemen night tidak menutupi teks */
    .night {
      z-index: 0;
    }
  </style>
</head>
<body class="not-loaded">
  <!-- Musik Latar -->
  <audio autoplay loop>
    <source src="suling.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
  </audio>

  <!-- Teks Romantis -->
  <div class="romantic-text">
    Cintaku padamu<br>
    Mekar seperti bunga-bunga malam ini,<br>
    Bersinar lembut dalam gelap...
  </div>

  <!-- Bagian bunga seperti sebelumnya -->
  <div class="night"></div>
  <div class="flowers">
    <!-- ... semua kode bunga dan tumbuhan tetap seperti milikmu ... -->
  </div>

  <script src="./script.js"></script>
</body>
</html>
